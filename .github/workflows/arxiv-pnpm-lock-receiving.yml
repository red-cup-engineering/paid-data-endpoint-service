name: Reconcile original pnpm dependency lock for arXiv source receiving
on:
  push:
    branches: [feat/arxiv-domain-search-oai-20261027]
    paths: ['.github/workflows/arxiv-pnpm-lock-receiving.yml']
permissions:
  contents: write
concurrency:
  group: arxiv-pnpm-original-lock-reconcile
  cancel-in-progress: false
jobs:
  receive-original-lock:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/arxiv-domain-search-oai-20261027
          persist-credentials: true
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Select exact package manager declared by original owner
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@11.19.0 --activate
          pnpm --version
      - name: Resolve only lock metadata through the actual registry
        run: |
          set -euo pipefail
          timeout 300s pnpm install --lockfile-only --ignore-scripts --no-frozen-lockfile
          git diff --check
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          const m=JSON.parse(readFileSync('package.json','utf8'));
          const lock=readFileSync('pnpm-lock.yaml','utf8');
          assert.equal(m.dependencies['@red-cup-engineering/xml-document-rendering-service'],'0.1.7');
          assert.match(lock,/['"]?@red-cup-engineering\/xml-document-rendering-service['"]?:\s*\n\s*specifier: 0\.1\.7/);
          assert.match(lock,/@red-cup-engineering\/xml-document-rendering-service@0\.1\.7/);
          NODE
      - name: Commit exact resolved original dependency closure to review branch
        run: |
          set -euo pipefail
          if git diff --quiet -- pnpm-lock.yaml; then
            echo 'Original lock already matches selected source'
          else
            git config user.name '561 Group dependency source receiver'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -- pnpm-lock.yaml
            git commit -m 'chore(arxiv): receive selected XML 0.1.7 exact pnpm lock closure'
            git push origin HEAD:feat/arxiv-domain-search-oai-20261027
          fi
          git ls-remote origin refs/heads/feat/arxiv-domain-search-oai-20261027
